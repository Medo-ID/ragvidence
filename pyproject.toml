[project]
name = "ragvidence"
version = "0.2.0"
description = "Evidence-first RAG retrieval diagnostics, built to run locally."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Medo-ID" }]
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.md"]
keywords = ["rag", "retrieval", "evaluation", "debugging", "bm25", "embeddings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "bm25s>=0.2.14,<0.3",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1,<2",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
pdf = ["pypdf>=6,<7"]
semantic = [
  "fastembed>=0.7,<1",
  # ONNX Runtime 1.24+ no longer publishes Intel macOS wheels.
  "onnxruntime>=1.17,<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
ragvi = "ragvidence.cli:app"

[project.urls]
Homepage = "https://ragvidence.medo-id.com"
Documentation = "https://ragvidence.medo-id.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/ragvidence"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs",
  "/README.md",
  "/LICENSE.md",
  "/NOTICE",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/CHANGELOG.md",
  "/THIRD_PARTY_NOTICES.md",
  "/THIRD_PARTY_LICENSES.md",
  "/.env.example",
  "/.python-version",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = ["/docs/maintainer", "/docs/portable-cli-design.md"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
