[project]
name = "ragvidence"
version = "0.1.0"
description = "Evidence-first RAG retrieval diagnostics, built to run locally."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Medo" }]
license = { file = "LICENSE.md" }
keywords = ["rag", "retrieval", "evaluation", "debugging", "bm25", "embeddings"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "bm25s>=0.2.14,<0.3",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
semantic = [
  "fastembed>=0.7,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
ragvi = "ragvidence.cli:app"

[project.urls]
Homepage = "https://ragvidence.medo-id.com"
Documentation = "https://ragvidence.medo-id.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/ragvidence"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE.md",
  "/SECURITY.md",
  "/SUPPORT.md",
  "/CHANGELOG.md",
  "/THIRD_PARTY_NOTICES.md",
  "/THIRD_PARTY_LICENSES.md",
  "/.env.example",
  "/.python-version",
  "/pyproject.toml",
  "/uv.lock",
]
exclude = ["/docs/maintainer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
