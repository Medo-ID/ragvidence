[project]
name = "rag-debugging-lab"
version = "0.1.0"
description = "Local CLI experiments and evidence-level diagnostics for RAG retrieval systems."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Medo" }]
dependencies = [
  "bm25s>=0.2.14,<0.3",
  "jinja2>=3.1,<4",
  "numpy>=2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
semantic = [
  "fastembed>=0.7,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
raglab = "raglab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/raglab"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
