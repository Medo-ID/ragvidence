name: Publish release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Verify only or publish the verified candidate to TestPyPI
        type: choice
        options: [verify, testpypi]
        default: verify
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Verify all supported platforms
    uses: ./.github/workflows/verify-release.yml
    with:
      release-tag: ${{ github.event_name == 'push' && github.ref_name || '' }}

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ragvidence
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ragvidence
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1

  verify-published:
    name: Install the exact published wheel
    needs: [publish-testpypi, publish-pypi]
    if: >-
      always() && (needs.publish-testpypi.result == 'success' || needs.publish-pypi.result == 'success')
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      HF_HUB_OFFLINE: "1"
      RAGVI_INDEX: ${{ needs.publish-testpypi.result == 'success' && 'testpypi' || 'pypi' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.9"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --dev --all-extras
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/published-candidate
      - name: Download the project wheel from the selected index and check its SHA
        run: >-
          uv run --no-sync python -m scripts.check_published --index "$RAGVI_INDEX"
          --candidate-dir dist/published-candidate --output verification/published/checks.json
          --online-install
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: published-installation
          path: verification/published/
          if-no-files-found: warn

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish-pypi, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Create release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${release_flags[@]}"
