name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Sync locked dependencies
        run: uv sync --frozen --dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest
      - name: Verify release fixtures
        run: uv run raglab verify
      - name: Build distributions
        run: uv build
